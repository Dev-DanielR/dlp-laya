{% extends "base.html" %}
{% block title %}Archivos · DAP Laya{% endblock %}
{% block heading %}Explorador de archivos{% endblock %}

{% block header_actions %}
<div class="flex items-center gap-3 text-sm">
  <span class="hidden text-slate-400 sm:inline">{{ user.username }}</span>
  <a
    href="{{ url_for('ui.auth_logout') }}"
    class="rounded-lg border border-slate-700 px-3 py-1.5 text-slate-200 hover:border-slate-500 hover:bg-slate-800"
  >Salir</a>
</div>
{% endblock %}

{% block content %}
<section class="rounded-2xl border border-slate-800 bg-slate-900/60 shadow-xl">
  <div id="browser">
    {% include "partials/listing.html" %}
  </div>
</section>
{% endblock %}
